name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Check formatting
        run: dotnet format --verify-no-changes --no-restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # Testcontainers uses the Docker daemon that ubuntu-latest already provides,
      # so no service container is declared here.
      - name: Test
        run: dotnet test --no-build --configuration Release --logger "trx;LogFileName=results.trx"

      - name: Fail on vulnerable packages
        run: |
          dotnet list package --vulnerable --include-transitive --format json > audit.json
          if jq -e '[.. | objects | select(has("vulnerabilities"))] | length > 0' audit.json > /dev/null; then
            echo "Vulnerable packages found."
            jq '.' audit.json
            exit 1
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/results.trx'
