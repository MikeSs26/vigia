# Tuned for a 1 GB host shared with an application server, not for a dedicated
# database machine. The defaults assume the box is PostgreSQL's alone.

# Supplying a custom config_file replaces the one the postgres image's own
# entrypoint would have generated - including the listen_addresses='*' it
# sets there. Without this line postgres falls back to its compiled-in
# default of 'localhost', which is unreachable from other containers on the
# docker network (only the host's own loopback binding on the published port
# controls outside exposure; this setting is about container-to-container
# reachability over the compose network).
listen_addresses = '*'

shared_buffers = 128MB
effective_cache_size = 256MB
work_mem = 4MB
maintenance_work_mem = 32MB

# One writer, one maintenance worker and a small number of readers. Every slot
# reserves memory whether or not it is used.
max_connections = 20

# Partition pruning across many child tables benefits from this being enabled,
# which it is by default; stated explicitly so a future change is deliberate.
enable_partition_pruning = on

wal_compression = on
checkpoint_completion_target = 0.9
