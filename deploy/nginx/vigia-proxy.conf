# Shared by the two public locations, so they cannot drift apart.

limit_req zone=vigia_req burst=10 nodelay;

# 429, not nginx's 503 default, so a throttled visitor sees the same code the
# application's own limiter returns rather than a different failure.
limit_req_status 429;
limit_conn_status 429;

# These are repeated here rather than inherited from the server block on
# purpose: nginx's add_header REPLACES the parent's set rather than adding to
# it, so the X-Cache-Status below would silently drop every security header if
# they were only declared once, further up.
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;
add_header X-Frame-Options DENY always;
add_header Content-Security-Policy
    "default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'" always;
# Six months, this host only. Safe to commit to: this name will never serve
# anything but this page, and it will always be over TLS.
add_header Strict-Transport-Security "max-age=15768000" always;

# Only GET and HEAD. The application answers both; anything else never reaches it.
if ($request_method !~ ^(GET|HEAD)$) {
    return 405;
}

# The single most important line in this configuration.
#
# The application authenticates before it rate-limits, and its API-key handler
# queries PostgreSQL the moment this header is present — on any path, including
# ones that match no route. Blanking it here means an anonymous request cannot
# reach the database at all, no matter what it sends.
proxy_set_header X-Api-Key "";

# Likewise for anything that could be mistaken for a credential downstream.
proxy_set_header Authorization "";
proxy_set_header Cookie "";

proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# Matches the application's own ten-second snapshot cache, so under load nginx
# serves from memory and the application is asked roughly six times a minute
# regardless of how many visitors arrive.
proxy_cache vigia_cache;
proxy_cache_valid 200 10s;
proxy_cache_lock on;
proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
add_header X-Cache-Status $upstream_cache_status always;

# A stalled snapshot rebuild behind the application's semaphore must not pin
# nginx workers waiting for it.
proxy_connect_timeout 5s;
proxy_send_timeout 15s;
proxy_read_timeout 15s;

proxy_http_version 1.1;
proxy_pass http://127.0.0.1:8080;
