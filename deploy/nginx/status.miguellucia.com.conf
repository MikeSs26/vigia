# Public status page for Vigia.
#
# This file is the security boundary, not a convenience. The application behind
# it fails open in two ways that only this configuration closes:
#
#   * Authentication runs before rate limiting, and the API-key handler queries
#     PostgreSQL the moment an X-Api-Key header is present — on any path. The
#     app now carries a global limiter as a backstop, but stripping the header
#     here means the database is never touched at all by an anonymous caller.
#
#   * ASP.NET routing ignores case and trailing slashes, so a deny-list is
#     bypassed by /V1/ingest. Everything below is an allow-list of exact paths.
#
# Any future edit that widens the location blocks re-opens both.

# Rate limiting by real client address. Behind Cloudflare this sees Cloudflare's
# address unless real_ip is configured below, which is why that section exists.
limit_req_zone $binary_remote_addr zone=vigia_req:10m rate=1r/s;
limit_conn_zone $binary_remote_addr zone=vigia_conn:10m;

# A small cache in front of the application's own. The app already serves a
# snapshot for ten seconds; this means it is not even asked to render during a
# flood, which matters on one shared vCPU.
proxy_cache_path /var/cache/nginx/vigia levels=1:2 keys_zone=vigia_cache:5m
                 max_size=32m inactive=10m use_temp_path=off;

# Anything arriving for a name we do not serve — including the bare IP — is
# dropped without a response. The application sets AllowedHosts to "*", so this
# is what stops it answering for any domain pointed at this machine.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name status.miguellucia.com;

    # Certbot writes its challenge here and rewrites the rest of this file to
    # redirect to HTTPS once a certificate exists.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # HTTP/2 is enabled on the listener rather than with the standalone `http2`
    # directive, which nginx only understands from 1.25.1 and this host is 1.24.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name status.miguellucia.com;

    # Certificate paths are filled in by certbot on first issue.
    ssl_certificate     /etc/letsencrypt/live/status.miguellucia.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/status.miguellucia.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:5m;
    ssl_session_timeout 1h;

    # Restore the visitor's real address from Cloudflare, so the rate limit
    # partitions by visitor rather than collapsing into one shared budget.
    # Only Cloudflare's own ranges are trusted; a header from anywhere else is
    # ignored, which is what stops an attacker minting themselves a fresh
    # identity per request.
    include /etc/nginx/cloudflare-real-ip.conf;

    # Security headers live in vigia-proxy.conf, not here. nginx's add_header
    # replaces the inherited set rather than extending it, so declaring them at
    # this level would leave them silently absent from the only two responses
    # anyone ever receives.

    # Neither route takes a body, and nginx buffers request bodies before
    # proxying even though the application refuses them.
    client_max_body_size 1k;
    client_body_timeout 10s;
    client_header_timeout 10s;

    limit_conn vigia_conn 10;

    # Exactly two paths reach the application. Everything else — /health, the
    # ingest and query endpoints, anything ASP.NET might add later — is dropped
    # here and never becomes reachable by widening this file accidentally.
    location = /public/status {
        include /etc/nginx/vigia-proxy.conf;
    }

    location = /public/status.json {
        include /etc/nginx/vigia-proxy.conf;
    }

    location / {
        return 444;
    }
}
